name: SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest

      - name: Run SDK verification
        run: python tests/verify_sdk.py

      - name: Validate all modules import
        run: |
          python3 -c "
          from orca_dojo_sdk import DojoWallet, AgentConfig, Task, LaneType
          from orca_dojo_sdk.wallet import DojoWallet
          from orca_dojo_sdk.types import AgentConfig, Task, LaneType
          from orca_dojo_sdk.kite import KiteClient
          print('✅ All SDK modules import successfully')
          "

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build setuptools

      - name: Build package
        run: python -m build --sdist

      - name: Verify package builds
        run: |
          ls dist/*.tar.gz
          echo "✅ Package builds successfully"
