name: SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK in development mode
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e .

      - name: Install test dependencies
        run: pip install pytest

      - name: Run SDK verification tests
        run: python tests/verify_sdk.py

      - name: Validate all modules import cleanly
        run: |
          python -c "
          from orca_dojo_sdk import DojoWallet, AgentConfig, Task, LaneType
          from orca_dojo_sdk.wallet import DojoWallet
          from orca_dojo_sdk.types import AgentConfig, Task, TaskResult, LaneType
          from orca_dojo_sdk.kite import KiteClient
          print('✅ All SDK modules import successfully')
          "

      - name: Validate package builds
        run: |
          pip install build
          python -m build --sdist
          echo "✅ Package builds successfully"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check orca_dojo_sdk/ || true
